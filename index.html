<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>象棋 · 本地版</title>
<meta name="theme-color" content="#b1624d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ab281a'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E8%B1%A1%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <section class="board-area">
    <div class="board-shell">
      <div class="board" id="board">
        <div class="grid" id="grid">
          <img class="board-grid" src="assets/board/board-lines.svg" alt="" draggable="false">
          <div class="layer" id="cells"></div>
          <div class="layer" id="marks"></div>
          <div class="layer" id="pieces"></div>
        </div>
        <div class="coords" id="coords"></div>
      </div>
    </div>
    <div class="scorebar" id="scorebar">
      <span class="side red" id="sideRed">红</span>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <span class="side black" id="sideBlack">黑</span>
      <span class="eval" id="evalText">—</span>
    </div>
  </section>

  <aside class="panel">
    <header class="panel-head">
      <h1>象棋</h1>
      <p class="status" id="status">轮到你走</p>
    </header>

    <div class="group">
      <label class="label" for="side">执子</label>
      <select id="side">
        <option value="r">红方（先手）</option>
        <option value="b">黑方（后手）</option>
      </select>
      <label class="label" for="level">对手</label>
      <div class="opponent">
        <img id="oppAvatar" class="avatar" src="assets/bots/meow.svg" alt="">
        <select id="level"></select>
      </div>
    </div>

    <div class="group">
      <label class="label">AI 自战等级</label>
      <div class="opponent">
        <span class="side-tag red">红</span>
        <img id="redAvatar" class="avatar" src="assets/bots/meow.svg" alt="">
        <select id="redLevel" aria-label="红方 AI 等级"></select>
      </div>
      <div class="opponent">
        <span class="side-tag black">黑</span>
        <img id="blackAvatar" class="avatar" src="assets/bots/huma.svg" alt="">
        <select id="blackLevel" aria-label="黑方 AI 等级"></select>
      </div>
    </div>

    <div class="group buttons">
      <button id="btnNew" class="primary">新局</button>
      <button id="btnUndo">悔棋</button>
      <button id="btnHint">提示</button>
      <button id="btnFlip">翻转</button>
      <button id="btnAuto">AI 自战</button>
    </div>

    <div class="group grow">
      <label class="label">着法</label>
      <ol class="moves" id="moves"></ol>
    </div>

    <div class="group engine">
      <label class="label">引擎</label>
      <div class="engine-line"><span id="engineState">加载中…</span></div>
      <div class="engine-line mono" id="engineInfo">&nbsp;</div>
      <div class="fen-row">
        <input id="fen" class="mono" spellcheck="false" aria-label="FEN">
        <button id="btnCopyFen" title="复制 FEN">复制</button>
      </div>
      <button id="btnLoadFen" class="ghost">载入 FEN</button>
      <a class="rogue-link" href="rogue.html">试玩 Roguelike 原型 →</a>
    </div>
  </aside>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
